packages:
  - "apps/*"
  - "packages/*"
# pnpm's build-script allowlist — every dependency install script needs an
# explicit yes here. esbuild's script installs its platform binary (vitest dep).
allowBuilds:
  # Test-only native SQLite driver — vitest runs the real engine incl. FTS5.
  better-sqlite3: true
  esbuild: true
minimumReleaseAgeExclude:
  - "@expo/cli@57.0.19"
  - "@expo/inline-modules@0.1.7"
  - "@expo/local-build-cache-provider@57.0.8"
  - "@expo/log-box@57.0.4"
  - "@expo/metro-config@57.0.11"
  - "@expo/metro-runtime@57.0.14"
  - "@expo/prebuild-config@57.0.15"
  - "@expo/router-server@57.0.8"
  - "@expo/ui@57.0.14"
  - babel-preset-expo@57.0.9
  - expo-asset@57.0.15
  - expo-constants@57.0.15
  - expo-file-system@57.0.6
  - expo-linking@57.0.8
  - expo-modules-autolinking@57.0.12
  - expo-modules-core@57.0.14
  - expo-modules-jsi@57.0.6
  - expo-router@57.0.17
  - expo-system-ui@57.0.3
  - expo@57.0.17
  - expo-sqlite@57.0.2
