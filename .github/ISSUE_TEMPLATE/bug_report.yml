name: Bug report
description: Something broke or behaved wrongly
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Never paste private journal content here — describe the shape of the data instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Lamp
        2. …
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device & OS
      placeholder: e.g. Redmi Note 12, Android 14 · or Chrome 139 on Windows 11
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version / commit
    validations:
      required: false
